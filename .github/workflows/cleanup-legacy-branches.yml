name: Archive verified legacy branches
on:
  push:
    branches: [dev]
    paths: [.github/workflows/cleanup-legacy-branches.yml]
permissions:
  contents: write
concurrency:
  group: stream-panel-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact snapshots and delete only verified branch heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          while read -r branch expected; do
            current=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')
            test "$current" = "$expected"
            git merge-base --is-ancestor "$expected" HEAD
            tag="archive/2026-10-10/$branch"
            if archived=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              test "$archived" = "$expected"
            else
              gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$expected" > /dev/null
            fi
            test "$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')" = "$expected"
            test "$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')" = "$expected"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          done <<'BRANCHES'
          feat/viewer-timeline 0cc1c1612a9c72f05c20784134e37dd56579b76b
          BRANCHES
