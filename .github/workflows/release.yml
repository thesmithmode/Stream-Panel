name: Linux release
on:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stream-panel-linux-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify current main and its passing quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '.workflow_runs | any(.conclusion == "success" and .head_branch == "main")' | grep -qx true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm prune --prod
      - run: node scripts/package-deb.mjs
      - run: node --test tests/packaging/deb.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: artifacts/*.deb
      - name: Publish stable Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          tag="v$version"
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            test "$(gh api "repos/$REPO/commits/$tag" --jq '.sha')" = "$(git rev-parse HEAD)"
            release_id=$(gh api "repos/$REPO/releases/tags/$tag" --jq '.id')
            gh api --method PATCH "repos/$REPO/releases/$release_id" -F prerelease=false -f make_latest=true > /dev/null
            echo 'This exact stable release is marked latest'
            exit 0
          fi
          gh release create "$tag" artifacts/*.deb --repo "$REPO" --target "$(git rev-parse HEAD)" --latest --title "Stream Panel $version — Linux release" --notes-file docs/linux-release.md
