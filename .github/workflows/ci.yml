name: Quality gate
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: python3 -m unittest discover -s tests/deploy -p '*test.py'
      - run: bash -n ops/bootstrap.sh ops/preflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux
          path: coverage/
          retention-days: 7
