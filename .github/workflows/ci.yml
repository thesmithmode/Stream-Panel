name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build once
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Archive exact build for tests and release
        run: |
          mkdir -p artifacts
          tar -czf artifacts/build.tar.gz dist apps/web/dist
          printf '%s\n' "$GITHUB_SHA" > artifacts/build.sha
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-build
          path: artifacts/build.*
          retention-days: 1
  segment:
    name: Tests / ${{ matrix.segment }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        segment: [unit, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.segment == 'e2e'
      - run: pnpm check:web
        if: matrix.segment == 'unit'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-build
          path: artifacts
      - name: Restore exact build
        run: |
          test "$(cat artifacts/build.sha)" = "$GITHUB_SHA"
          tar -xzf artifacts/build.tar.gz
      - run: node scripts/test-with-coverage.mjs ${{ matrix.segment }}
      - name: Verify incremental history on 10,000 streams
        if: matrix.segment == 'unit'
        run: node --max-old-space-size=128 scripts/benchmark-analytics-load.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.segment }}
          path: coverage/
          retention-days: 1
  operations:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/deploy -p '*test.py'
      - run: for script in ops/*.sh; do bash -n "$script"; done
      - run: bash ops/test-bootstrap-ci.sh
  server-bundle:
    name: Linux server bundle
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: compiled-build
          path: artifacts
      - name: Restore exact build
        run: |
          test "$(cat artifacts/build.sha)" = "$GITHUB_SHA"
          tar -xzf artifacts/build.tar.gz
      - run: pnpm prune --prod
      - run: node scripts/server-bundle.mjs
        env:
          STREAM_PANEL_RELEASE: ${{ github.sha }}
      - name: Validate server bundle
        run: |
          set -euo pipefail
          test "$(cut -d ' ' -f 1 artifacts/server.header)" = "$GITHUB_SHA"
          test "$(sha256sum artifacts/server.tar.gz | cut -d ' ' -f 1)" = "$(cut -d ' ' -f 2 artifacts/server.header)"
          tar -tzf artifacts/server.tar.gz > artifacts/server.contents
          grep -qx 'dist/apps/daemon/src/index.js' artifacts/server.contents
          grep -qx 'apps/web/dist/index.html' artifacts/server.contents
          grep -qx 'bin/node' artifacts/server.contents
          grep -qx 'scripts/verify-cache.mjs' artifacts/server.contents
          grep -qx 'scripts/verify-donations.mjs' artifacts/server.contents
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        with:
          name: server-bundle
          path: |
            artifacts/server.header
            artifacts/server.tar.gz
          retention-days: 7
          if-no-files-found: error
  check:
    name: Combined quality gate
    needs: [segment, operations, server-bundle]
    if: always() && needs.segment.result == 'success' && needs.operations.result == 'success' && needs.server-bundle.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/segments
      - run: node scripts/coverage-gate.mjs segments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-combined
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          retention-days: 1
