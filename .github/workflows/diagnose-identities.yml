name: Read-only identity diagnostics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only reported identity diagnostics
        env:
          BOOTSTRAP_KEY: ${{ secrets.STREAM_PANEL_BOOTSTRAP_KEY }}
          DEPLOY_HOST: ${{ secrets.STREAM_PANEL_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.STREAM_PANEL_DEPLOY_PORT }}
          KNOWN_HOSTS: ${{ secrets.STREAM_PANEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$BOOTSTRAP_KEY" > "$task_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$task_dir/known-hosts"
          ssh -i "$task_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/known-hosts" -o ConnectTimeout=15 "root@$DEPLOY_HOST" 'python3 -' < ops/diagnose-identities.py
