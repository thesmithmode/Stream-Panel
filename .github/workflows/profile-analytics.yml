name: Read-only analytics profiling
on:
  push:
    branches: [diagnostics/analytics-profile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only stream collection diagnostics
        env:
          BOOTSTRAP_KEY: ${{ secrets.STREAM_PANEL_BOOTSTRAP_KEY }}
          DEPLOY_HOST: ${{ secrets.STREAM_PANEL_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.STREAM_PANEL_DEPLOY_PORT }}
          KNOWN_HOSTS: ${{ secrets.STREAM_PANEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$BOOTSTRAP_KEY" > "$task_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$task_dir/known-hosts"
          ssh -i "$task_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_dir/known-hosts" -o ConnectTimeout=15 "root@$DEPLOY_HOST" 'set -eu; set -a; . /etc/stream-panel/server.env; set +a; cd /opt/stream-panel/current/scripts; ../bin/node --max-old-space-size=128 --input-type=module' < scripts/profile-analytics.mjs
