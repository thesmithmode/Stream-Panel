name: Deploy server
on:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stream-panel-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.STREAM_PANEL_PRODUCTION_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Check exact current main and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          test "$sha" = "$main_sha" || { echo 'Commit superseded on main'; exit 1; }
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '.workflow_runs | any(.conclusion == "success" and .head_branch == "main")' | grep -qx true
          printf 'STREAM_PANEL_RELEASE=%s\n' "$sha" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm prune --prod
      - run: node scripts/server-bundle.mjs
      - name: Send immutable release over restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.STREAM_PANEL_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.STREAM_PANEL_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.STREAM_PANEL_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STREAM_PANEL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Production SSH secrets not configured'; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          cat artifacts/server.header artifacts/server.tar.gz | ssh -i "$key_file" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=15 "stream-panel-deploy@$DEPLOY_HOST"
      - name: Remove runner artifacts
        if: always()
        run: rm -rf artifacts/server artifacts/server.tar.gz artifacts/server.header
